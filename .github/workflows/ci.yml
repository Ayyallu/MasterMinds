name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masterminds
          POSTGRES_PASSWORD: masterminds
          POSTGRES_DB: masterminds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U masterminds"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://masterminds:masterminds@localhost:5432/masterminds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify migrations apply from clean
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  # Deployment is intentionally NOT automated here. Promotion to
  # staging/production is a gated, manually-approved workflow that runs
  # `alembic upgrade head` as a release step before rolling out new images.
  # See docs/PHASE10_DEPLOYMENT.md. No provider is assumed.

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend for browser tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          pip install pytest==8.3.4 playwright==1.55.0 pytest-playwright==0.6.2
          python -m playwright install --with-deps chromium
      - name: Run student browser journey
        working-directory: .
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_ORIGIN: http://localhost:8000
        run: |
          cd frontend
          npm run start -- --hostname 127.0.0.1 > /tmp/masterminds-next.log 2>&1 &
          cd ..
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/student > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/student > /dev/null
          python -m pytest frontend/e2e -q
